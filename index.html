<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AV Energías — Formulario de colaboración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1F3A;
    --navy-panel:#142B4D;
    --amber:#E8A33D;
    --amber-dark:#B97A1F;
    --cream:#F7F5EF;
    --ink:#1A2333;
    --slate:#5B6B85;
    --line:#DCD8CB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
  }
  .page{
    max-width:640px;
    margin:0 auto;
    padding:0 0 64px;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:40px 32px 34px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    width:280px;height:280px;
    border-radius:50%;
    background:var(--amber);
    opacity:0.14;
    right:-120px;
    top:-120px;
  }
  .logo-box{
    display:inline-block;
    background:#fff;
    border-radius:10px;
    padding:10px 20px;
    margin:0 0 20px;
    position:relative;
  }
  .logo-box img{
    display:block;
    height:44px;
    width:auto;
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:28px;
    margin:0 0 6px;
    position:relative;
  }
  header p{
    color:var(--amber);
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin:0;
    position:relative;
  }
  main{padding:36px 32px 0;}
  .toggle{
    display:flex;
    gap:10px;
    margin-bottom:28px;
  }
  .toggle label{
    flex:1;
    text-align:center;
    padding:13px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
  }
  .toggle input{position:absolute; opacity:0; pointer-events:none;}
  .toggle input:checked + label{
    border-color:var(--amber-dark);
    background:rgba(232,163,61,0.12);
    color:var(--amber-dark);
  }
  fieldset{
    border:none;
    padding:0;
    margin:0;
    display:none;
    flex-direction:column;
    gap:18px;
  }
  fieldset.active{display:flex;}
  legend{
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:500;
    margin:0 0 4px;
    padding:0;
  }
  .row{display:flex; flex-direction:column; gap:6px;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:480px){.two-col{grid-template-columns:1fr;}}
  label.field-label{
    font-size:13px;
    font-weight:500;
    color:var(--ink);
  }
  input[type=text], input[type=email], input[type=tel], textarea{
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
    outline:none;
    width:100%;
  }
  input[type=text]:focus, input[type=email]:focus, input[type=tel]:focus, textarea:focus{
    border-color:var(--amber-dark);
    box-shadow:0 0 0 3px rgba(232,163,61,0.22);
  }
  textarea{resize:vertical; min-height:70px;}
  .file-row{
    border:1px dashed var(--line);
    border-radius:6px;
    padding:14px;
    background:#fff;
  }
  .file-row input[type=file]{
    font-size:13px;
    width:100%;
  }
  .required{color:var(--amber-dark);}
  .disclaimer{
    font-size:12px;
    color:var(--slate);
    margin-top:4px;
  }
  button{
    margin-top:26px;
    width:100%;
    background:var(--navy);
    color:#fff;
    border:none;
    padding:15px 20px;
    font-size:15px;
    font-weight:500;
    border-radius:6px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  button:hover{background:#0F284A;}
</style>
</head>

    <h1>Crece con nosotros</h1>
    <p>Formulario de colaboración</p>
  </header>

  <main>
    <!--
      IMPORTANTE: sustituye TU_EMAIL@dominio.com por tu correo real en el
      atributo action del formulario, más abajo. La primera vez que llegue
      un envío, FormSubmit pedirá confirmar el correo con un clic (una sola vez).
      Los archivos adjuntos (DNI, CIF) viajan pegados al email; el plan
      gratuito de FormSubmit admite adjuntos de hasta unos 5MB por archivo.
    -->
    <form action="https://formsubmit.co/colaboradores@avenergias.com" method="POST" enctype="multipart/form-data" id="colabForm">
      <input type="hidden" name="_subject" value="Nueva solicitud de colaboración - AV Energías">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">

      <div class="toggle">
        <input type="radio" name="tipo" id="tipoEmpresa" value="Empresa" checked>
        <label for="tipoEmpresa">Empresa</label>
        <input type="radio" name="tipo" id="tipoAutonomo" value="Autónomo">
        <label for="tipoAutonomo">Autónomo</label>
      </div>

      <fieldset id="fsEmpresa" class="active">
        <legend>Datos de la empresa</legend>

        <div class="row">
          <label class="field-label">Nombre de la sociedad <span class="required">*</span></label>
          <input type="text" name="Nombre de la sociedad" required>
        </div>

        <div class="row">
          <label class="field-label">CIF <span class="required">*</span></label>
          <input type="text" name="CIF" required>
        </div>

        <div class="row">
          <label class="field-label">Dirección fiscal completa (dirección, población, provincia, CP) <span class="required">*</span></label>
          <textarea name="Dirección fiscal completa (empresa)" required></textarea>
        </div>

        <div class="row">
          <label class="field-label">Nombre y apellidos del administrador <span class="required">*</span></label>
          <input type="text" name="Nombre y apellidos del administrador" required>
        </div>

        <div class="row">
          <label class="field-label">DNI del administrador <span class="required">*</span></label>
          <input type="text" name="DNI del administrador" required>
        </div>

        <div class="row">
          <label class="field-label">Cuenta para pago de autofacturas <span class="required">*</span></label>
          <input type="text" name="Cuenta pago autofacturas (empresa)" required>
        </div>

        <div class="two-col">
          <div class="row">
            <label class="field-label">Email <span class="required">*</span></label>
            <input type="email" name="Email (empresa)" required>
          </div>
          <div class="row">
            <label class="field-label">Teléfono <span class="required">*</span></label>
            <input type="tel" name="Teléfono (empresa)" required>
          </div>
        </div>

        <div class="row file-row">
          <label class="field-label">DNI del administrador (archivo) <span class="required">*</span></label>
          <input type="file" name="DNI_administrador_archivo" accept=".pdf,.jpg,.jpeg,.png">
        </div>

        <div class="row file-row">
          <label class="field-label">CIF (archivo) <span class="required">*</span></label>
          <input type="file" name="CIF_archivo" accept=".pdf,.jpg,.jpeg,.png">
        </div>
      </fieldset>

      <fieldset id="fsAutonomo">
        <legend>Datos del autónomo</legend>

        <div class="row">
          <label class="field-label">Nombre y apellidos <span class="required">*</span></label>
          <input type="text" name="Nombre y apellidos">
        </div>

        <div class="row">
          <label class="field-label">DNI <span class="required">*</span></label>
          <input type="text" name="DNI">
        </div>

        <div class="row">
          <label class="field-label">Dirección fiscal completa (dirección, población, provincia, CP) <span class="required">*</span></label>
          <textarea name="Dirección fiscal completa (autónomo)"></textarea>
        </div>

        <div class="row">
          <label class="field-label">Cuenta para pago de autofacturas <span class="required">*</span></label>
          <input type="text" name="Cuenta pago autofacturas (autónomo)">
        </div>

        <div class="two-col">
          <div class="row">
            <label class="field-label">Email <span class="required">*</span></label>
            <input type="email" name="Email (autónomo)">
          </div>
          <div class="row">
            <label class="field-label">Teléfono <span class="required">*</span></label>
            <input type="tel" name="Teléfono (autónomo)">
          </div>
        </div>

        <div class="row file-row">
          <label class="field-label">DNI (archivo) <span class="required">*</span></label>
          <input type="file" name="DNI_archivo" accept=".pdf,.jpg,.jpeg,.png">
        </div>
      </fieldset>

      <p class="disclaimer">Al enviar aceptas que usemos estos datos para gestionar tu alta como colaborador de AV Energías.</p>
      <button type="submit">Enviar solicitud</button>
    </form>
  </main>

</div>

<script>
  var radios = document.querySelectorAll('input[name="tipo"]');
  var fsEmpresa = document.getElementById('fsEmpresa');
  var fsAutonomo = document.getElementById('fsAutonomo');

  function camposDe(fieldset){
    return fieldset.querySelectorAll('input[type=text], input[type=email], input[type=tel], textarea, input[type=file]');
  }

  function actualizar(){
    var esEmpresa = document.getElementById('tipoEmpresa').checked;
    fsEmpresa.classList.toggle('active', esEmpresa);
    fsAutonomo.classList.toggle('active', !esEmpresa);

    camposDe(fsEmpresa).forEach(function(el){
      el.required = esEmpresa;
      el.disabled = !esEmpresa;
    });
    camposDe(fsAutonomo).forEach(function(el){
      el.required = !esEmpresa;
      el.disabled = esEmpresa;
    });
  }

  radios.forEach(function(r){ r.addEventListener('change', actualizar); });
  actualizar();
</script>

</body>
</html>
